
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>

    <div id="telaInicial" class="tela">
        <h2>Bem-vindo!</h2>
        <p>Prepare-se para jogar!</p>
        <button onclick="iniciarJogo()">JOGAR</button>
    </div>

    <div class="painel">
        Pontuação: <span id="score">0</span>
    </div>

    <div id="areaJogo">
        <canvas id="game" width="400" height="400"></canvas>
    </div>

    <div id="telaFinal" class="tela escondido">
        <h2>Fim de jogo!</h2>
        <p>Sua pontuação: <span id="pontuacaoFinal">0</span></p>
        <button onclick="iniciarJogo()">REINICIAR</button>
    </div>

    <p>Use as setas do teclado para controlar!</p>
<audio id="musica" src="sons/musica.mp3" loop></audio>
<audio id="somComer" src="sons/comer.mp3"></audio>
<audio id="somGameOver" src="sons/gameover.mp3"></audio>
<audio id="somClique" src="sons/clique.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
